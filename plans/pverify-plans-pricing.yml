not_published:
- overage rate once the included monthly transaction quota is exhausted
- a pure per-transaction rate outside a bundled tier
- month-to-month (non-annual) pricing
- a free trial or self-service checkout — every CTA routes to https://pverify.com/request-a-demo/
- pricing for Dental Eligibility, Patient Cost Estimation, the CGX widget or the Payers API
notes: >-
  Prices are published floors ("Starting at"). Billing is noted as quarterly with monthly
  subscriptions available. Confirm the final rate, the overage rate and API entitlement with
  pVerify before integrating — the API is an Enterprise-tier feature on the products that list it.
