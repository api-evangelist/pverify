description: >-
  CORRECTED 2026-08-15. Earlier rounds of this artifact recorded pVerify as sales-led with no
  published pricing. That is wrong: pVerify publishes a real per-product rate card at
  https://pverify.com/pricing/, with two named tiers per product, a monthly floor price and an
  included monthly transaction quota on each. Four products are priced — Advanced Eligibility,
  Insurance Discovery, MBI Lookup and Claim Status — for eight priced tiers in total, plus two
  published onboarding fees. Every price is quoted as "Starting at", so these are published FLOORS
  rather than final rates, and pVerify still quotes the actual contract. API access is the
  material tier boundary: on all four products the Standard tier is portal-only and the API is an
  ENTERPRISE-tier entitlement. Nothing on the page states an overage rate, a per-transaction rate
  beyond the bundle, a free trial, or a month-to-month option — those remain unpublished.
api_access_note: >-
  The pricing page lists "API" and "API Integrations" as Enterprise-tier features on Advanced
  Eligibility, Insurance Discovery and Claim Status. A buyer on a Standard tier gets the Premium
  Portal, not the REST API documented in openapi/. MBI Lookup does not list API on either tier.
