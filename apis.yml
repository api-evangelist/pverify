name: pVerify
kind: company
description: pVerify provides real-time healthcare insurance eligibility verification
  and revenue-cycle APIs. Its RESTful API at https://api.pverify.com exchanges EDI
  270/271 eligibility transactions, returns plan and benefit summaries, checks claim
  status (276/277), lists supported payers, and estimates patient financial
  responsibility, secured with OAuth2 bearer tokens.
