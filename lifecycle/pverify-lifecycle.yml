generated: '2026-08-14'
method: searched
source: https://postman.pverify.com/ + https://pverify.com/api-developers/ + https://status.dosespot.com/posts/dashboard
description: >-
  pVerify publishes no written versioning or deprecation policy. What it does publish is a dated
  documentation set (the Postman collection carries "Last Updated 03/01/2026") in which retired
  products are marked "(Discontinued)" in the folder name while remaining fully documented, and a
  status dashboard operated by its parent, DoseSpot / Interra Health.
versioning:
  scheme: path-segment, per endpoint, opt-in
  current: unversioned paths, with one /api/v2/ endpoint
  policy_url: null
  note: >-
    Only /api/v2/DentalEligibilitySummary is version-prefixed. Everything else is unversioned.
    Generations are named in prose in the docs ("Our 1st Generation Methods", "Our 2nd Generation
    Methods", "1 Step Easy Methods") rather than in the URL, so a client cannot pin a generation.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  mechanism: >-
    Products are retired by relabelling the documentation folder "(Discontinued)". No Sunset or
    Deprecation response header, no dated removal schedule, and no migration guide is published.
    Discontinued endpoints remain documented in full.
  note: >-
    No `type: Deprecation` pointer is emitted for this provider: marking a folder Discontinued is
    a deprecation SIGNAL, not a deprecation POLICY, and the operational-transparency check reads
    a published policy.
deprecated_operations:
- {operationId: sameOrSimilarInquiry, spec: openapi/pverify-same-or-similar-api-openapi.yml}
