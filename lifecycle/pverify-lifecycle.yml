- {operationId: cmnInquiry, spec: openapi/pverify-cmn-api-openapi.yml}
- {operationId: getCMNResponse, spec: openapi/pverify-cmn-api-openapi.yml}
- {operationId: getCmnReport, spec: openapi/pverify-cmn-api-openapi.yml}
- {operationId: snfInquiry, spec: openapi/pverify-snf-api-openapi.yml}
- {operationId: getSNFResponse, spec: openapi/pverify-snf-api-openapi.yml}
status_page:
  url: https://status.dosespot.com/posts/dashboard
  title: DoseSpot Application Health
  operator: DoseSpot / Interra Health (pVerify's parent — pVerify links this dashboard from its own developer page)
  probe: {status: 200, checked: '2026-08-14'}
payer_status_api:
  note: >-
    pVerify also exposes machine-readable availability for the payer network itself, which is the
    dependency most likely to fail for a caller: GET /api/GetPayerStatus (unauthenticated) returns
    Payer Up / Payer Active / Payer Inactive / Payer Down per payer, and
    GET /API/GetPayerStatusStatistics?status=Rejected&checkForLastNumberOfHours=1 returns recently
    failing payers.
  endpoints:
  - /api/GetPayerStatus
  - /API/GetPayerStatusStatistics
sla:
  url: https://pverify.com/wp-content/uploads/2025/04/Exhibit-B-SLA.docx
  page: https://pverify.com/pverify-legal-documentation/
  uptime_target: null
  format: .docx
  probe: {status: 200, checked: '2026-08-15'}
  note: >-
    CORRECTED 2026-08-15 — an earlier round recorded "no public SLA". pVerify DOES publish one:
    "Exhibit B – SLA" is downloadable from https://pverify.com/pverify-legal-documentation/
    alongside "Exhibit A – Terms of Service". It is a Word .docx, not an HTML page, so it is
    human-readable but not machine-readable, and no uptime percentage could be extracted without
    downloading and parsing the binary. Recorded as present-but-unreadable rather than absent.
