        \ | \nString | \nMessage | \n\nDetails.SNFRequestID | \nint | \nSNF request ID | \n\nDetails.CreatedOn\
        \ | \nString | \nTime Stamp of date and time created | \n\nDetails.BillingType | \nString | \n\
        Billing Type | \n\nmessage | \nString | \nMessage | \n\nstatus | \nString | \nStatus | \n\napiResponseCode\
        \ | \nint | \nAPI Response Code | \n\napiResponseMessage | \nString | \nAPI Response Message |"
      deprecated: true
