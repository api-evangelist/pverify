  /API/SNFInquiry:
    post:
      operationId: snfInquiry
      tags:
      - SNF
      summary: SNF Inquiry
      description: "Environment | \nURL | \n\nProduction | \nhttps://api.pverify.com/API/SNFInquiry |\
        \ \n\nThe pVerify API for SNF is like Same or Similar in that it will not deliver a result instantly,\
        \ instead the user is expected to call the GET method 1 minute later.\n\nKey | \nValue | \n\n\
        URL | \nhttps://api.pverify.com/API/SNFInquiry | \n\nMethod | \nPOST | \n\nHeaders | \nDescription\
        \ | \n\nContent-Type | \napplication/json | \n\nAuthorization | \nAuthorization token from above\
        \ preceded by the String \"Bearer\" | \n\nClient-API-Id* | \nYour pVerify client-api-id | \n\n\
        Body | \nSee Below | \n\nSNF Codes Inquiry Request Fields\n\nKey | \nType | \nUsage | \nValue\
        \ | \n\nPayerCode | \nString | \nRequired | \nPayer Code | \n\nMemberId | \nString | \nRequired\
        \ | \nMember ID | \n\nPatientFirstName | \nString | \nRequired | \nPatient First Name | \n\nPatientLastName\
        \ | \nString | \nRequired | \nPatient Last Name | \n\nPatientDOB | \nString | \nRequired | \n\
        Patient Date of Birth (MM/DD/YYYY) | \n\nPatientStateCode | \nString | \nRequired | \nPatient\
        \ State | \n\nDOS | \nString | \nOptional | \nDate of Service (MM/DD/YYYY) | \n\nLocation | \n\
        String | \nOptional | \nLocation is the practice location. Note by setting this, you will lock\
        \ the patient to one location, so that users that login in via our portal who are not authorized\
        \ to see that location will not see the patient. | \n\nCallbackURL | \nString | \nOptional | \n\
        JSON response will be posted to callbackURL when inquiry is processed and if callbackURL is valid.\
        \ This URL should support HTTP POST method and Content-Type =’application/json’ | \n\nMRN | \n\
        String | \nOptional | \nMedical Record Number (like Same or Similar, when populated we will send\
        \ the results back to this URL) - optional | \n\nSNF Codes Inquiry Response Fields\n\nKey | \n\
        Type | \nDescription | \n\nrequestId | \nString | \nrequestId | \n\nProcessed | \nboolean | \n\
        Returns true if processed | \n\nisDataError | \nboolean | \nDetermines if data error occurred\
        \ | \n\nerrorMessage | \nString | \nError Message | \n\nDetails | \nObject | \nDetails | \n\n\
        Details.DOSStart | \nString | \nDate of service start date (Format: MM/DD/YYYY) | \n\nDetails.DOSEnd\
        \ | \nString | \nDate of service end (Format: MM/DD/YYYY) | \n\nDetails.AdmitanceDate | \nString\
        \ | \nAdmitance date | \n\nDetails.DischargedDate | \nString | \nDischarged date | \n\nDetails.BillingNPI\
        \ | \nString | \nBilling NPI | \n\nDetails.PatientStatus | \nString | \nPatient Status | \n\n\
        Details.Message | \nString | \nDetails Message | \n\nDetails.SNFRequestId | \nInt | \nSNF request\
        \ ID | \n\nDetails.CreatedOn | \nString | \nDate and time created | \n\nDetails.BillingType |\
        \ \nString | \nBilling type | \n\nMessage | \nString | \nMessage | \n\nStatus | \nString | \n\
        Status | \n\nexpectedTimeInSeconds | \nString | \nExpected time to get response (when you can\
        \ call GET) | \n\napiResponseCode | \nint | \nAPI Response Code | \n\napiResponseMessage | \n\
        String | \nAPI Response Message |"
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                PayerCode:
                  type: string
                  example: '00007'
                MemberId:
                  type: string
                  example: 123456789A
                PatientFirstName:
                  type: string
                  example: firstName
                PatientLastName:
                  type: string
                  example: lastName
                PatientDOB:
                  type: string
                  example: 01/02/1983
                PatientStateCode:
                  type: string
                  example: TX
                DOS:
                  type: string
                  example: 07/22/2020
                Location:
                  nullable: true
                CallbackURL:
                  nullable: true
                MRN:
                  nullable: true
            example:
              PayerCode: '00007'
              MemberId: 123456789A
              PatientFirstName: firstName
              PatientLastName: lastName
              PatientDOB: 01/02/1983
              PatientStateCode: TX
              DOS: 07/22/2020
              Location: null
              CallbackURL: null
              MRN: null
      responses:
        '200':
          description: OK
      security:
      - bearerAuth: []
        clientApiId: []
