method: derived
status: candidate
source: openapi/ (derived from pVerify's published Postman collection at https://postman.pverify.com/)
description: >-
  pVerify ships NO MCP server. Searches of pVerify's own site, developer hub, GitHub organization
  (github.com/pVerify), npm, PyPI and the public MCP server directories returned nothing, and no
  MCP endpoint is named anywhere in pVerify's documentation. The tools below are a CANDIDATE
  surface derived by API Evangelist from the OpenAPI documents in openapi/ — one tool per real
  operationId. They are a design proposal for what a pVerify MCP server would expose, not something
  an agent can call today.
search:
  checked:
  - {source: 'https://pverify.com/api-developers/', result: no MCP mentioned}
  - {source: 'https://postman.pverify.com/', result: no MCP mentioned}
  - {source: 'https://github.com/pVerify', result: no MCP repository}
  - {source: npm, query: '@pverify/mcp, pverify-mcp', result: not found}
  - {source: pypi, query: 'pverify-mcp', result: not found}
  - {source: web search, query: 'pVerify MCP server model context protocol', result: no first-party server}
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: derived
  note: >-
    mode is `none` because nobody — pVerify or a third party — ships a pVerify MCP server, remote
    or stdio. No endpoint URL is guessed here; a fabricated path that happened to answer 200 would
    read as a verified agent surface, which is the worst possible outcome for this artifact.
pointer_decision:
  mcp_server: >-
    NO `type: MCPServer` pointer is emitted in apis.yml. The pointer asserts the provider operates
    an MCP server; pVerify does not. This file records a derived candidate and an honest absence.
prerequisites_for_a_real_server:
  auth: >-
    Every tool except get_payer_status needs an OAuth2 client-credentials bearer token from
    POST /Token PLUS the account's Client-API-Id header. There are no scopes — entitlements are
    attached to the account contract, so an MCP server cannot narrow a token per tool.
  billing: >-
    Every inquiry tool is separately billable per transaction and there is no idempotency key,
    so an agent retry creates a duplicate charge. Any real server must gate the inquiry_* tools
    behind confirmation and correlate with GetPendingInquiries rather than re-POSTing.
  phi: >-
    Every request and response carries PHI. A server would need a BAA with pVerify and must not
    log payloads.
