method: probed
source: live GET of each /.well-known/ path on every pVerify host in apis.yml and openapi servers[]
summary: >-
  pVerify serves no /.well-known/ discovery documents. The API hosts (api.pverify.com,
  testapi.pverify.com) return a real IIS 404 for every path. The marketing site
  (www.pverify.com / pverify.com) answers HTTP 200 with the WordPress homepage HTML for
  EVERY /.well-known/* path — a catch-all soft-200, not a document — so those 200s are
  recorded as misses, and no WellKnown or SecurityTxt pointer is emitted.
documents: []
