source: https://postman.pverify.com/ — the "Tables" section of pVerify's published Postman collection
description: The controlled vocabularies a caller must use to talk to pVerify. Service Type Codes are
  the ASC X12 EB03 set pVerify accepts on the 1st-generation EligibilityInquiry endpoint; Practice Type
  Codes are pVerify's own bundles of those service types, used on the 2nd-generation EligibilitySummary
  endpoints, and they differ between the production and test environments. Both are published by pVerify
  as HTML tables inside its Postman collection and are extracted here verbatim.
